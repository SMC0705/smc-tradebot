yaml
name: Trading-Bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tradebot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bot ausführen
        env:
          BOT_MODE: paper
        run: python -m bot.main
      - name: Ergebnis speichern
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add state docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Bot-Lauf $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
