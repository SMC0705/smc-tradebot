<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMC Tradebot</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e8eaf0;--mut:#8a90a0;--up:#22c55e;--down:#ef4444;--acc:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:17px;font-weight:600}
.badge{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:99px;background:#f59e0b22;color:#f59e0b}
.badge.live{background:#22c55e22;color:var(--up)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:8px;font:inherit;font-weight:600}
.seg button.on{background:var(--line);color:var(--txt)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.lbl{color:var(--mut);font-size:13px}
.big{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.pct{font-size:17px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
svg.chart{width:100%;height:90px;display:block;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l b{display:block}.row .l span,.row .r span{color:var(--mut);font-size:12px}
.row .r{text-align:right;white-space:nowrap;padding-left:10px}.row .r b,.row .r span{display:block}
h2{font-size:14px;color:var(--mut);font-weight:600;margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:16px}.stats span{font-size:11px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:12px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
.warn{background:#ef444422;color:#fca5a5;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
#reload{background:none;border:0;color:var(--acc);font:inherit;font-weight:600}
</style>
</head>
<body>
<header><h1>SMC Tradebot</h1><span id="mode" class="badge">DEMO</span></header>
<div id="warn"></div>
<div class="seg" id="seg"></div>
<div class="card">
  <div class="lbl">Aktuelles Guthaben</div>
  <div class="big" id="eq">–</div>
  <div class="pct" id="pct">–</div>
  <svg class="chart" id="chart" viewBox="0 0 300 90" preserveAspectRatio="none"></svg>
  <div class="stats" id="stats"></div>
</div>
<h2>Offene Trades</h2><div class="card" id="open"></div>
<h2>Letzte Trades</h2><div class="card" id="trades"></div>
<div class="foot"><span id="upd"></span> · <button id="reload">Aktualisieren</button></div>

<script>
const eur = v => (v ?? 0).toLocaleString("de-DE", {style: "currency", currency: "EUR"});
const pc = v => (v > 0 ? "+" : "") + (v ?? 0).toLocaleString("de-DE", {maximumFractionDigits: 2}) + " %";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const when = t => new Date(t * 1000).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const px = v => v == null ? "–" : v.toLocaleString("de-DE", {maximumSignificantDigits: 6});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let data = null, view = "total";
try { view = localStorage.getItem("view") || "total"; } catch (e) {}

function sources() {
  const h = location.hostname, parts = location.pathname.split("/").filter(Boolean);
  const list = [];
  if (h.endsWith(".github.io") && parts.length)
    list.push(`https://raw.githubusercontent.com/${h.split(".")[0]}/${parts[0]}/main/docs/data/status.json?t=${Date.now()}`);
  list.push(`data/status.json?t=${Date.now()}`);
  return list;
}

async function load() {
  for (const u of sources()) {
    try { const r = await fetch(u, {cache: "no-store"}); if (r.ok) { data = await r.json(); break; } } catch (e) {}
  }
  render();
}

function chart(curve) {
  const el = document.getElementById("chart");
  if (!curve || curve.length < 2) { el.innerHTML = ""; return; }
  const ys = curve.map(p => p[1]), mn = Math.min(...ys), mx = Math.max(...ys), r = mx - mn || 1;
  const pts = ys.map((y, i) => `${(i / (ys.length - 1) * 300).toFixed(1)},${(85 - (y - mn) / r * 80).toFixed(1)}`).join(" ");
  const col = ys[ys.length - 1] >= ys[0] ? "var(--up)" : "var(--down)";
  el.innerHTML = `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

function totalCurve() {
  const cs = Object.values(data.strategies).map(s => s.curve);
  const n = Math.min(...cs.map(c => c.length));
  return Array.from({length: n}, (_, i) => [cs[0][cs[0].length - n + i][0], cs.reduce((a, c) => a + c[c.length - n + i][1], 0)]);
}

function render() {
  if (!data) { document.getElementById("warn").innerHTML = '<div class="warn">Noch keine Daten. Läuft der Bot schon?</div>'; return; }
  const S = data.strategies, keys = Object.keys(S);
  if (view !== "total" && !S[view]) view = "total";
  document.getElementById("seg").innerHTML = [["total", "Gesamt"], ...keys.map(k => [k, S[k].name])]
    .map(([k, n]) => `<button data-k="${k}" class="${k === view ? "on" : ""}">${esc(n)}</button>`).join("");
  const mode = document.getElementById("mode");
  mode.textContent = data.mode === "live" ? "ECHTGELD" : "DEMO";
  mode.className = "badge" + (data.mode === "live" ? " live" : "");

  const sel = view === "total" ? keys.map(k => S[k]) : [S[view]];
  const eq = view === "total" ? data.total.equity : S[view].equity;
  const p = view === "total" ? data.total.pnl_pct : S[view].pnl_pct;
  document.getElementById("eq").textContent = eur(eq);
  const pe = document.getElementById("pct");
  pe.textContent = `${pc(p)} seit Start`; pe.className = "pct " + cls(p);
  chart(view === "total" ? totalCurve() : S[view].curve);

  const trades = sel.flatMap(s => s.trades.map(t => ({...t, s: s.name}))).sort((a, b) => b.closed_t - a.closed_t).slice(0, 20);
  const n = sel.reduce((a, s) => a + s.stats.trades, 0);
  const wins = sel.reduce((a, s) => a + (s.stats.winrate ?? 0) * s.stats.trades / 100, 0);
  const dd = Math.max(...sel.map(s => s.stats.max_drawdown_pct));
  document.getElementById("stats").innerHTML =
    `<div><b>${n}</b><span>Trades</span></div><div><b>${n ? Math.round(wins / n * 100) + " %" : "–"}</b><span>Trefferquote</span></div><div><b>-${dd.toLocaleString("de-DE")} %</b><span>Max. Rückgang</span></div>`;

  const open = sel.flatMap(s => s.positions.map(x => ({...x, s: s.name})));
  document.getElementById("open").innerHTML = open.length ? open.map(x => `
    <div class="row"><div class="l"><b>${esc(x.pair)}</b><span>${esc(x.s)} · seit ${when(x.opened_t)}</span></div>
    <div class="r"><b class="${cls(x.pnl_pct)}">${pc(x.pnl_pct)}</b><span>${eur(x.value)}</span></div></div>`).join("")
    : '<div class="empty">Keine offenen Trades</div>';

  document.getElementById("trades").innerHTML = trades.length ? trades.map(t => `
    <div class="row"><div class="l"><b>${esc(t.pair)} · ${esc(t.result)}</b><span>${esc(t.s)} · ${when(t.closed_t)} · ${px(t.entry)} → ${px(t.exit)}</span></div>
    <div class="r"><b class="${cls(t.pnl)}">${eur(t.pnl)}</b><span>${pc(t.pnl_pct)}</span></div></div>`).join("")
    : '<div class="empty">Noch keine abgeschlossenen Trades</div>';

  const age = (Date.now() / 1000 - data.updated_at) / 60;
  document.getElementById("upd").textContent = `Stand: ${when(data.updated_at)}`;
  const w = [];
  if (age > 120) w.push(`Letzte Aktualisierung vor ${Math.round(age / 60)} Std. – Bot prüfen.`);
  if (sel.some(s => s.halted)) w.push("Not-Aus aktiv: −25 % vom Höchststand erreicht, keine neuen Trades.");
  if (data.errors && data.errors.length) w.push("Fehler beim letzten Lauf: " + data.errors.map(esc).join(", "));
  document.getElementById("warn").innerHTML = w.map(x => `<div class="warn">${x}</div>`).join("");
}

document.getElementById("seg").addEventListener("click", e => {
  const k = e.target.dataset.k; if (!k) return;
  view = k; try { localStorage.setItem("view", k); } catch (e) {}
  render();
});
document.getElementById("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60 * 1000);
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
